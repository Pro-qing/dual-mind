    <text x="58" y="545" font-size="11" style="fill: #6e7d93" class="mono">01</text>


    <text x="88" y="545" font-size="11" style="fill: #9dbdf5" class="mono">for (let attempt = 0; attempt &lt; maxAttempts; attempt++) {</text>


    <text x="58" y="567" font-size="11" style="fill: #6e7d93" class="mono">02</text>


    <text x="88" y="567" font-size="11" style="fill: #d9c5f7" class="mono">  signal?.throwIfAborted();</text>


    <text x="58" y="589" font-size="11" style="fill: #6e7d93" class="mono">03</text>


    <text x="88" y="589" font-size="11" style="fill: #b5d9c0" class="mono">  try { return await run(); } catch (error) { /* retry */ }</text>


    <text x="58" y="611" font-size="11" style="fill: #6e7d93" class="mono">04</text>


    <text x="88" y="611" font-size="11" style="fill: #d9e4f4" class="mono">}</text>


