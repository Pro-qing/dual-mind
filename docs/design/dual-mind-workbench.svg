  <title id="title">DualMind — dark-theme interface proposal, pending review</title>


  <desc id="description">Static design proposal showing a task input, Worker and Reviewer conversation columns, collaboration controls, human feedback, and a disabled apply action. All content is illustrative; no interface has been implemented.</desc>


