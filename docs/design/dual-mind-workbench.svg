    <text x="44" y="473" font-size="13" style="fill: #abb8ca">The next pass will address the review feedback.</text>


    <rect x="44" y="489" width="648" height="138" rx="6" fill="#171b22" stroke="#303947"/>


    <text x="58" y="511" font-size="11" style="fill: #b7c7dd" class="mono">src/utils/retry.ts</text>


    <text x="675" y="511" font-size="9" style="fill: #91a0b5" font-weight="600" text-anchor="end">EXAMPLE ONLY</text>


