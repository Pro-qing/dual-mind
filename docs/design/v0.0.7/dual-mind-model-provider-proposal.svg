  <text x="1262" y="700" class="small muted">界面展示，不会请求。</text>
  <text x="1262" y="726" class="small muted">Illustrative values only.</text>
  <text x="24" y="882" font-size="10" fill="#9ca8b7">STATIC PROPOSAL · 示意界面 · No credentials or live model calls</text>
  <text x="1416" y="882" font-size="10" fill="#8b96a4" text-anchor="end">1440 × 900 · Approval precedes UI integration</text>
