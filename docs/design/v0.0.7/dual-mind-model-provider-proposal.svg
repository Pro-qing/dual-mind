  <text x="334" y="620" class="small muted">可分别绑定连接和模型。</text>
  <text x="334" y="640" class="small muted">Bind each role independently.</text>

  <rect x="582" y="176" width="646" height="636" rx="10" fill="#fff" stroke="#e0e5ec"/>
  <text x="608" y="212" class="section">编辑连接</text>
  <text x="608" y="233" class="small muted">Connection details</text>
