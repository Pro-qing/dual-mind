  <text x="622" y="305" class="body">Command Code</text>

  <text x="608" y="356" class="label">提供商 / Provider</text>
  <rect x="608" y="366" width="286" height="48" rx="7" class="active"/>
  <text x="751" y="386" class="body" font-weight="700" text-anchor="middle">Command Code</text>
  <text x="751" y="402" class="small muted" text-anchor="middle">兼容 API / Compatibility API</text>
  <rect x="902" y="366" width="296" height="48" rx="7" class="field"/>
  <text x="1050" y="395" class="body" text-anchor="middle">OpenAI-compatible</text>

  <text x="608" y="451" class="label">推理协议 / Inference protocol</text>
  <rect x="608" y="461" width="190" height="38" rx="6" class="field"/>
  <text x="703" y="485" class="body" text-anchor="middle">Chat Completions</text>
  <rect x="806" y="461" width="144" height="38" rx="6" class="active"/>
  <text x="878" y="485" class="body" font-weight="700" text-anchor="middle">Responses</text>
  <rect x="958" y="461" width="240" height="38" rx="6" class="field"/>
  <text x="1078" y="485" class="body" text-anchor="middle">Anthropic Messages</text>

  <text x="608" y="536" class="label">Base URL</text>
  <rect x="608" y="546" width="590" height="40" rx="6" class="field"/>
  <text x="622" y="571" class="body">https://commandcode.ai/provider/v1</text>
  <text x="608" y="607" class="small muted">兼容入口地址由用户提供；不包含密钥。</text>
  <text x="608" y="625" class="small muted">Use the compatibility endpoint; never enter a native CLI command here.</text>

  <text x="608" y="666" class="label">模型 ID / Model ID</text>
  <rect x="608" y="676" width="590" height="40" rx="6" class="field"/>
  <text x="622" y="701" class="body">command-model-id</text>
  <text x="608" y="739" class="small muted">手动输入或刷新列表；不按名称推测能力。</text>
  <text x="608" y="757" class="small muted">Discovery filters declared supported_endpoints for the selected protocol.</text>
  <rect x="608" y="777" width="176" height="24" rx="5" fill="#eef5ff"/>
  <text x="696" y="794" font-size="11" fill="#275c9b" text-anchor="middle">密钥通过 VS Code 安全提示设置</text>

  <rect x="1244" y="176" width="172" height="636" rx="10" fill="#fff" stroke="#e0e5ec"/>
  <text x="1262" y="211" class="section" font-size="14">安全与查询</text>
  <text x="1262" y="233" class="small muted">Safety</text>
  <circle cx="1270" cy="269" r="8" fill="#e7f5ed"/>
  <text x="1270" y="273" font-size="10" fill="#258052" text-anchor="middle">✓</text>
  <text x="1286" y="267" class="small" fill="#263244">不显示密钥</text>
  <text x="1286" y="283" class="small muted">Key stays hidden</text>
  <circle cx="1270" cy="322" r="8" fill="#e7f5ed"/>
  <text x="1270" y="326" font-size="10" fill="#258052" text-anchor="middle">✓</text>
  <text x="1286" y="320" class="small" fill="#263244">手动模型 ID</text>
  <text x="1286" y="336" class="small muted">Manual selection</text>
  <line x1="1262" y1="366" x2="1398" y2="366" class="line"/>
  <text x="1262" y="395" class="small" font-weight="700" fill="#354154">连接检查</text>
  <text x="1262" y="419" class="small muted">仅获取模型列表，</text>
  <text x="1262" y="437" class="small muted">不发送推理请求。</text>
  <text x="1262" y="463" class="small muted">Fetches model IDs;</text>
  <text x="1262" y="481" class="small muted">never sends a prompt.</text>
  <rect x="1262" y="516" width="136" height="36" rx="6" fill="#3478d4"/>
