<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">DualMind — model provider and protocol settings proposal / 模型提供商与协议设置提案</title>
  <desc id="description">Static proposal for manually configured OpenAI-compatible, Anthropic and Command Code model connections. The image contains no real credentials or model request.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #697586; }
      .small { font-size: 12px; }
      .label { font-size: 13px; font-weight: 650; fill: #2b3545; }
      .body { font-size: 14px; fill: #243043; }
      .section { font-size: 16px; font-weight: 700; fill: #192435; }
      .line { stroke: #e1e6ed; stroke-width: 1; }
      .field { fill: #fff; stroke: #cfd6df; stroke-width: 1; }
      .pill { fill: #eef2f7; }
      .active { fill: #e7f0ff; stroke: #2f6fca; stroke-width: 1.3; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f4f6f9"/>
