  <text x="29" y="873" fill="#aab4c2" font-size="11" text-anchor="middle">0.0.7</text>
  <rect x="58" y="0" width="228" height="900" fill="#fff"/>
  <text x="82" y="47" font-size="13" font-weight="700" fill="#263244">DUALMIND</text>
  <text x="82" y="92" class="section">设置 Settings</text>
  <text x="82" y="133" class="small muted">工作区 / Workspace</text>
  <rect x="70" y="151" width="204" height="40" rx="7" fill="#edf4ff"/>
  <rect x="70" y="151" width="3" height="40" rx="2" fill="#3478d4"/>
  <text x="88" y="176" class="body" font-weight="650">模型连接 Model connections</text>
  <text x="88" y="221" class="body muted">Reviewer 角色</text>
  <text x="88" y="266" class="body muted">执行设置</text>
  <line x1="76" y1="300" x2="269" y2="300" class="line"/>
  <text x="82" y="335" class="small muted">本机设置 · 不同步凭据</text>
  <rect x="286" y="0" width="1154" height="52" fill="#fff"/>
  <text x="312" y="33" class="small muted">设置 / Settings</text>
  <text x="1420" y="33" class="small muted" text-anchor="end">静态方案 · 不含真实凭据</text>
  <text x="312" y="102" font-size="25" font-weight="750" fill="#182334">模型连接</text>
  <text x="435" y="102" font-size="16" fill="#697586">Model connections</text>
  <text x="312" y="130" class="body muted">为每个服务手动设置地址、认证方式与模型 ID；不自动猜测或切换协议。</text>
  <text x="312" y="150" class="small muted">Manually configure the provider, protocol, endpoint and model ID. No live discovery is implied.</text>

  <rect x="312" y="176" width="254" height="636" rx="10" fill="#fff" stroke="#e0e5ec"/>
  <text x="334" y="210" class="section">已保存连接</text>
  <text x="334" y="231" class="small muted">Saved connections</text>
  <rect x="328" y="250" width="222" height="73" rx="8" fill="#f0f5fc" stroke="#c8d9ee"/>
  <circle cx="348" cy="275" r="5" fill="#38a169"/>
  <text x="364" y="279" class="body" font-weight="650">Team gateway</text>
  <text x="348" y="301" class="small muted">OpenAI-compatible · key saved</text>
  <rect x="328" y="333" width="222" height="73" rx="8" fill="#fff" stroke="#e4e8ee"/>
  <circle cx="348" cy="358" r="5" fill="#8b99aa"/>
  <text x="364" y="362" class="body" font-weight="650">Claude account</text>
  <text x="348" y="384" class="small muted">Anthropic Messages</text>
  <rect x="328" y="416" width="222" height="73" rx="8" fill="#fff" stroke="#e4e8ee"/>
  <circle cx="348" cy="441" r="5" fill="#8b99aa"/>
  <text x="364" y="445" class="body" font-weight="650">Command Code</text>
  <text x="348" y="467" class="small muted">Compatibility API</text>
  <rect x="328" y="508" width="222" height="38" rx="7" fill="#fff" stroke="#cfd6df"/>
