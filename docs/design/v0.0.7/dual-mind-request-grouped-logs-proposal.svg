  <text x="88" y="128" class="label" font-weight="700">Fix auth handoff</text>
  <text x="88" y="147" class="small muted">Review · Round 2</text>
  <text x="88" y="205" class="label muted">Conversation</text>
  <text x="88" y="248" class="label muted">Task details</text>
  <text x="88" y="291" class="label muted">Settings</text>
  <line x1="72" y1="328" x2="270" y2="328" class="line"/>
  <text x="82" y="362" class="small muted">One task · one timeline</text>
  <rect x="288" y="0" width="1152" height="52" fill="#fff"/>
  <text x="312" y="33" class="small muted">Workbench / Fix auth handoff / Logs</text>
  <text x="1418" y="33" class="small muted" text-anchor="end">Static proposal · 示意界面</text>

  <text x="312" y="103" font-size="24" font-weight="750" fill="#192536">执行日志</text>
  <text x="410" y="103" font-size="16" fill="#697586">Execution log</text>
  <text x="312" y="132" class="body muted">先按用户提出的每条问题／需求分组，再在组内按 Reviewer 与 Worker 折叠。</text>
  <text x="312" y="153" class="small muted">Group by each user request first, then nest role-specific logs inside that request.</text>
  <rect x="1218" y="91" width="198" height="38" rx="7" fill="#fff" stroke="#cfd6df"/>
  <text x="1317" y="115" class="small" fill="#354154" text-anchor="middle">全部展开 / Expand all</text>

