  <text x="414" y="448" class="small muted">Read-only inspection · 3 acceptance points · request f102…6ca9</text>
  <text x="1338" y="439" class="small muted" text-anchor="end">11:09:12</text>

  <rect x="368" y="470" width="994" height="55" rx="7" fill="#fff" stroke="#e4e8ee"/>
  <circle cx="391" cy="497" r="10" fill="#e8f0fb"/>
