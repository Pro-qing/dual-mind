  <text x="414" y="557" class="label" font-weight="650">Review submitted · pass · low risk · 0.94 confidence</text>
  <text x="414" y="576" class="small muted">TASK_COMPLETE received on its own line · 2 evidence items</text>
  <text x="1338" y="567" class="small muted" text-anchor="end">11:22:03</text>

