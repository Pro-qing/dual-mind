<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">DualMind — execution logs grouped by user request and role / 按用户请求与角色折叠的执行日志提案</title>
  <desc id="description">Static proposal showing user request groups with nested Reviewer and Worker accordions. Stable request IDs group answers, process text, tools and checks without merging role histories.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .muted { fill: #788596; }
      .small { font-size: 12px; }
      .body { font-size: 14px; fill: #273346; }
      .label { font-size: 14px; fill: #273346; }
      .strong { font-size: 15px; font-weight: 700; fill: #1e2a3a; }
      .line { stroke: #e1e6ed; stroke-width: 1; }
      .panel { fill: #fff; stroke: #dfe5ec; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f3f5f8"/>
