  <path d="M360 623l6 6 6-6" fill="none" stroke="#637186" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="389" cy="628" r="9" fill="#207b87"/>
  <text x="407" y="633" class="label" font-weight="700">Worker / 执行者</text>
  <text x="1366" y="633" class="small muted" text-anchor="end">6 events · 4 tools · expanded</text>

  <rect x="368" y="663" width="994" height="55" rx="7" fill="#fff" stroke="#e4e8ee"/>
  <circle cx="391" cy="690" r="10" fill="#e8f0fb"/>
  <text x="391" y="694" font-size="10" fill="#2c6cb5" text-anchor="middle">i</text>
  <text x="414" y="686" class="label" font-weight="650">Implemented provider adapters</text>
  <text x="414" y="705" class="small muted">Chat Completions · Responses · Anthropic Messages · Command Code compatibility</text>
  <text x="1338" y="696" class="small muted" text-anchor="end">11:16:25</text>

  <rect x="368" y="727" width="994" height="43" rx="7" fill="#fff" stroke="#e4e8ee"/>
  <circle cx="391" cy="748" r="9" fill="#eef2f7"/>
  <text x="391" y="752" font-size="10" fill="#586579" text-anchor="middle">…</text>
  <text x="414" y="753" class="small muted">Earlier file reads and test records are nested here · chronological within each role</text>
  <text x="24" y="882" font-size="10" fill="#9ca8b7">STATIC PROPOSAL · 示意界面 · Illustrative IDs and timestamps</text>
  <text x="1416" y="882" font-size="10" fill="#8b96a4" text-anchor="end">1440 × 900 · Approval precedes UI integration</text>
</svg>
