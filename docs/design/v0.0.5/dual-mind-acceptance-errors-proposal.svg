<text x="64" y="184" font-size="14" fill="#b1bdce" font-weight="400">历史失败记录：2</text>
<text x="64" y="218" font-size="15" fill="#efaaaa" font-weight="700">当前验收阻塞：1</text>
<rect x="64" y="249" width="608" height="120" rx="5" fill="#20242c" stroke="#394352"/>
<rect x="64" y="249" width="3" height="120" rx="0" fill="#b1bdce" stroke="none"/>
<text x="78" y="275" font-size="14" fill="#b1bdce" font-weight="700">探查命令 · 曾经失败</text>
<text x="78" y="303" font-size="12" fill="#b1bdce" font-weight="400">查找可选配置文件时未找到。</text>
<text x="78" y="324" font-size="12" fill="#b1bdce" font-weight="400">该记录保留供查阅，不单独决定任务是否完成。</text>
<rect x="64" y="389" width="608" height="150" rx="5" fill="#20242c" stroke="#394352"/>
<rect x="64" y="389" width="3" height="150" rx="0" fill="#efaaaa" stroke="none"/>
<text x="78" y="415" font-size="14" fill="#efaaaa" font-weight="700">取消行为回归 · 失败</text>
<text x="78" y="443" font-size="12" fill="#b1bdce" font-weight="400">验收项：cancel · 方案 v2 · 当前文件版本</text>
<text x="78" y="464" font-size="12" fill="#b1bdce" font-weight="400">退出码 1，最新验证未通过。</text>
<text x="78" y="485" font-size="12" fill="#b1bdce" font-weight="400">Reviewer 不能使用更早的成功结果覆盖它。</text>
<text x="64" y="587" font-size="13" fill="#b1bdce" font-weight="400">Worker 可以诚实提交失败证据及未解决事项。Reviewer 制定修复方案，验收不自动通过。</text>
<rect x="744" y="118" width="648" height="660" rx="6" fill="#191c22" stroke="#394352"/>
<rect x="744" y="118" width="648" height="36" rx="0" fill="#20242c" stroke="none"/>
<text x="756" y="142" font-size="14" fill="#e4e8f0" font-weight="700">修复后 · 使用新的验证证据</text>
<text x="760" y="184" font-size="14" fill="#b1bdce" font-weight="400">历史失败记录：2</text>
<text x="760" y="218" font-size="15" fill="#93dfcd" font-weight="700">当前验收阻塞：0</text>
<rect x="760" y="249" width="616" height="150" rx="5" fill="#20242c" stroke="#394352"/>
<rect x="760" y="249" width="3" height="150" rx="0" fill="#93dfcd" stroke="none"/>
<text x="774" y="275" font-size="14" fill="#93dfcd" font-weight="700">取消行为回归 · 成功</text>
<text x="774" y="303" font-size="12" fill="#b1bdce" font-weight="400">验收项：cancel · 方案 v3 · 修复后文件版本</text>
<text x="774" y="324" font-size="12" fill="#b1bdce" font-weight="400">退出码 0 · 当前证据有效</text>
<text x="774" y="345" font-size="12" fill="#b1bdce" font-weight="400">旧失败继续保留为历史。</text>
<rect x="760" y="419" width="616" height="120" rx="5" fill="#20242c" stroke="#394352"/>
