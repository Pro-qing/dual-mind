<text x="774" y="473" font-size="12" fill="#b1bdce" font-weight="400">覆盖全部验收项，核对当前文件与最新证据。</text>
<text x="774" y="494" font-size="12" fill="#b1bdce" font-weight="400">任务完成不自动提交、合并或推送。</text>
<text x="760" y="586" font-size="13" fill="#b1bdce" font-weight="400">零条历史错误不是完成条件；未执行、未知结果或过期证据均不能作为成功证据。</text>
<text x="48" y="818" font-size="12" fill="#b1bdce" font-weight="400">验收阻塞由宿主按当前方案与证据计算；界面错误总数和工具调用结束状态不代替正式验收。</text>
<rect x="28" y="858" width="1384" height="1" rx="0" fill="#394352" stroke="none"/>
<text x="28" y="882" font-size="11" fill="#b1bdce" font-weight="400">静态示例 · 工具结果、命令成功与正式验收分别表达 · 37 组设计已确认</text>
