<text x="744" y="344" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">Tab：任务名称 → 删除图标 → 下一任务名称。</text>
<text x="744" y="368" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">Enter / Space 打开任务；删除图标是独立按钮。</text>
<text x="744" y="395" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">焦点轮廓沿用主题颜色：2px 描边，向外偏移 2px。</text>
<path d="M48 427H1392" fill="none" stroke="#394352"/>
