<text x="838" y="579" font-size="14" fill="#e4e8f0" font-weight="700" text-anchor="start">修复重试取消逻辑并保留最后一次错误信息，覆盖长时间等待、恢复执行</text>
<text x="838" y="600" font-size="14" fill="#e4e8f0" font-weight="700" text-anchor="start">、重复取消以及多个连续请求的完整回归场景</text>
<text x="838" y="642" font-size="13" fill="#b1bdce" font-weight="400" text-anchor="start">删除此任务及任务记录？工作区文件和其他任务会保留。</text>
<path d="M826 700H1310" fill="none" stroke="#394352"/>
<rect x="1166" y="712" width="54" height="34" rx="5" fill="#293443" stroke="#394352"/>
<text x="1180" y="734" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">取消</text>
<rect x="1238" y="712" width="54" height="34" rx="5" fill="#793f49" stroke="#a56973"/>
<text x="1252" y="734" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">删除</text>
<text x="744" y="800" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">取消保留任务；确认后删除任务记录，工作区文件保留。</text>
<text x="744" y="824" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">活动任务使用“停止并删除”；请求期间确认、取消及关闭均禁用。</text>
