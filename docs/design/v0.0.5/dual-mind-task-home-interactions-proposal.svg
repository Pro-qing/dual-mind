</g>
<rect x="76" y="251" width="592" height="49" rx="4" fill="#272d37" stroke="#647184"/>
<text x="88" y="273" font-size="12" fill="#e4e8f0" font-weight="400" text-anchor="start">修复重试取消逻辑并保留最后一次错误信息，覆盖长时间等待、恢复执行、重复取消以及多个连续请求的完</text>
<text x="88" y="290" font-size="12" fill="#e4e8f0" font-weight="400" text-anchor="start">整回归场景</text>
<text x="48" y="344" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">长名称只在列表中省略；悬停提示使用完整任务名。</text>
<text x="48" y="368" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">提示对应现有 title；可访问名称保留全文。提示外观由宿主决定。</text>
<text x="48" y="395" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">点击名称后，需求、配置与执行信息在该任务详情中查看。</text>
