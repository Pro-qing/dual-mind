<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">29. 任务列表交互状态 — 待审核</title>
<desc id="description">2026-11-23，依据当前工作区尚未提交的紧凑任务列表修改补充。归档于 v0.0.5，晚于原 v0.0.5 标签；待审核。任务、计数与状态均为静态示例，不是运行或验证结果。所有文字及图形均可编辑。</desc>
<style>text { font-family: "Noto Sans CJK SC", "DejaVu Sans", sans-serif; }</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#171a20" stroke="none"/>
<text x="28" y="37" font-size="23" fill="#e4e8f0" font-weight="700" text-anchor="start">29. 任务列表交互状态</text>
<text x="28" y="66" font-size="13" fill="#b1bdce" font-weight="400" text-anchor="start">四个独立局部状态 · 悬停提示与键盘焦点 · 只读示例 · 删除确认</text>
<text x="1412" y="31" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="end">v0.0.5 修订 · 待审核 · 2026-11-23</text>
