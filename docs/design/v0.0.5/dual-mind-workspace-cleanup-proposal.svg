<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
<title id="title">34. 工作树清理与成果恢复 — 待审核</title>
<desc id="description">DualMind 工作树、上下文与成果收尾静态设计，2026-11-23。场景 30–34 待视觉审核，新增页面控件尚未接入。任务、目录、分支、估算量和错误均为示例，不是运行或验证结果。</desc>
<style>text { font-family: "Noto Sans CJK SC", "DejaVu Sans", sans-serif; }</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#171a20" stroke="none"/>
<text x="28" y="37" font-size="23" fill="#e4e8f0" font-weight="700" text-anchor="start">34. 工作树清理与成果恢复</text>
<text x="28" y="66" font-size="13" fill="#b1bdce" font-weight="400" text-anchor="start">保存成果后再清理 · 快照独立于任务记录 · 清理后通过新任务继续</text>
<text x="1412" y="31" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="end">v0.0.5 修订 · 待审核 · 2026-11-23</text>
<path d="M28 86H1412" fill="none" stroke="#394352"/>
<rect x="48" y="120" width="416" height="650" rx="6" fill="#191c22" stroke="#394352"/>
