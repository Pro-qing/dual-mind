<text x="528" y="212" font-size="12" fill="#93dfcd" font-weight="400" text-anchor="start">已保存 · 2026-11-23 14:32</text>
<text x="528" y="262" font-size="12" fill="#b1bdce" font-weight="700" text-anchor="start">基点／提交</text>
<rect x="528" y="272" width="384" height="36" rx="5" fill="#171c24" stroke="#394352"/>
<text x="538" y="295" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">main · f29c810</text>
<text x="528" y="337" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">3 个文件 · 包含未提交成果</text>
<text x="528" y="357" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">原任务已删除；快照仍可恢复。</text>
<rect x="528" y="406" width="106" height="34" rx="5" fill="#293443" stroke="#394352"/>
<text x="542" y="428" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">查看保存内容</text>
<rect x="528" y="455" width="106" height="34" rx="5" fill="#305981" stroke="#394352"/>
<text x="542" y="477" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">恢复为新任务</text>
<rect x="528" y="522" width="384" height="102" rx="5" fill="#213047" stroke="#456a91"/>
<text x="540" y="545" font-size="12" fill="#91bbff" font-weight="400" text-anchor="start">恢复会建立新的隔离工作树和任务分支，恢复文件与暂存状态。新任</text>
<text x="540" y="565" font-size="12" fill="#91bbff" font-weight="400" text-anchor="start">务重新规划及验收。</text>
<text x="528" y="685" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">恢复后的依赖目录由项目工具重新生成。</text>
<rect x="976" y="120" width="416" height="650" rx="6" fill="#191c22" stroke="#394352"/>
<rect x="976" y="120" width="416" height="34" rx="0" fill="#20242c" stroke="none"/>
<text x="988" y="143" font-size="13" fill="#e4e8f0" font-weight="700" text-anchor="start">原任务 · 历史记录</text>
<path d="M976 154H1392" fill="none" stroke="#394352"/>
<text x="992" y="182" font-size="19" fill="#e4e8f0" font-weight="700" text-anchor="start">完善导出操作</text>
<text x="992" y="214" font-size="13" fill="#b1bdce" font-weight="400" text-anchor="start">工作树已清理 · 历史只读</text>
<rect x="992" y="246" width="384" height="100" rx="5" fill="#20242c" stroke="#394352"/>
<text x="1004" y="272" font-size="13" fill="#91bbff" font-weight="700" text-anchor="start">Reviewer · 验收记录</text>
<text x="1004" y="299" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">已验证导出需求与回归检查。此处保留当时的任务结论。</text>
<text x="992" y="399" font-size="12" fill="#b1bdce" font-weight="700" text-anchor="start">后续任务基点</text>
<rect x="992" y="409" width="384" height="36" rx="5" fill="#171c24" stroke="#394352"/>
<text x="1002" y="432" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">已整合目标 · main</text>
<path d="M1353 423l5 5 5-5" fill="none" stroke="#b1bdce" stroke-width="1.5"/>
<rect x="992" y="472" width="106" height="34" rx="5" fill="#305981" stroke="#394352"/>
<text x="1006" y="494" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">创建后续任务</text>
<text x="992" y="540" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">若成果尚未整合，可从“保存的成果”恢复到新任务；不会自动丢弃上次</text>
<text x="992" y="560" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">未提交修改。</text>
<rect x="992" y="644" width="384" height="94" rx="5" fill="#213047" stroke="#456a91"/>
<text x="1004" y="667" font-size="12" fill="#91bbff" font-weight="400" text-anchor="start">清理后停止接受原任务的新执行消息。后续任务沿用选择的需求和角</text>
<text x="1004" y="687" font-size="12" fill="#91bbff" font-weight="400" text-anchor="start">色，重新取得证据。</text>
<text x="48" y="816" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">快照、任务分支与执行记录分别保存；固定恢复标识可查找，清理不依赖会变动的 stash 序号。</text>
