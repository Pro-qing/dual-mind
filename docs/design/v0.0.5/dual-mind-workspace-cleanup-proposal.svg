<text x="60" y="143" font-size="13" fill="#e4e8f0" font-weight="700" text-anchor="start">清理任务工作树</text>
<path d="M48 154H464" fill="none" stroke="#394352"/>
<text x="64" y="182" font-size="19" fill="#e4e8f0" font-weight="700" text-anchor="start">完善导出操作</text>
<text x="64" y="220" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">即将保存：暂存／未暂存修改、未跟踪文件与需要保留的忽略文件。</text>
<text x="64" y="293" font-size="12" fill="#b1bdce" font-weight="700" text-anchor="start">工作树</text>
<rect x="64" y="303" width="384" height="36" rx="5" fill="#171c24" stroke="#394352"/>
<text x="74" y="326" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">…/task-worktrees/…/任务 ID</text>
<text x="64" y="373" font-size="12" fill="#b1bdce" font-weight="700" text-anchor="start">排除的可再生成目录</text>
<rect x="64" y="388" width="384" height="60" rx="4" fill="#20242c" stroke="#394352"/>
<text x="76" y="413" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">node_modules/</text>
<text x="76" y="436" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">.venv/</text>
<rect x="64" y="472" width="384" height="102" rx="5" fill="#302b23" stroke="#716047"/>
<text x="76" y="495" font-size="12" fill="#eac58c" font-weight="400" text-anchor="start">保存不完整时阻止清理。独有提交保留任务分支；本操作保留任务历</text>
<text x="76" y="515" font-size="12" fill="#eac58c" font-weight="400" text-anchor="start">史。</text>
<text x="64" y="611" font-size="12" fill="#b1bdce" font-weight="400" text-anchor="start">删除任务另需确认；保存的成果不随任务记录删除。</text>
<path d="M48 704H464" fill="none" stroke="#394352"/>
<rect x="232" y="720" width="54" height="34" rx="5" fill="#293443" stroke="#394352"/>
<text x="246" y="742" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">取消</text>
<rect x="304" y="720" width="93" height="34" rx="5" fill="#305981" stroke="#394352"/>
<text x="318" y="742" font-size="13" fill="#e4e8f0" font-weight="400" text-anchor="start">保存并清理</text>
