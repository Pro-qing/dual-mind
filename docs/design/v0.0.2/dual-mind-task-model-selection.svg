<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">DualMind — task model selection proposal</title>
  <desc id="description">Pending-review static design for new and edited drafts. Worker and Reviewer choose independent saved connections and model IDs, with searchable suggestions, refresh and manual input. Examples show a missing key that still permits draft saving, preserved saved bindings, connection-scoped suggestions and a stacked narrow layout.</desc>
  <style>text { font-family: "DejaVu Sans", Arial, sans-serif; } .mono { font-family: "DejaVu Sans Mono", monospace; }</style>
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#191c22"/>
  <g id="editor-chrome">
  <rect x="0" y="0" width="1440" height="40" rx="0" fill="#13161b"/>
  <rect x="0" y="0" width="224" height="40" rx="0" fill="#191c22"/>
  <rect x="0" y="0" width="224" height="2" rx="0" fill="#91bbff"/>
  <rect x="22" y="12" width="14" height="16" rx="3" fill="#2b4161"/>
  <text x="46" y="26" font-size="13" fill="#e4e8f0" font-weight="400">DualMind</text>
  <path d="M199 14 l10 10 M209 14 l-10 10" fill="none" stroke="#b1bdce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="224" y1="39" x2="1440" y2="39" stroke="#394352"/>
  <text x="1416" y="25" font-size="11" fill="#b1bdce" font-weight="400" text-anchor="end">MODEL DISCOVERY / 07</text>
  </g>
  <g id="application-header">
  <rect x="24" y="64" width="44" height="44" rx="10" fill="#223047"/>
  <path d="M43 77 L35 86 L43 95 M49 77 L57 86 L49 95" fill="none" stroke="#a2c4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="86" font-size="24" fill="#e4e8f0" font-weight="600">DualMind / Tasks</text>
  <text x="85" y="110" font-size="12" fill="#b1bdce" font-weight="400">Independent connections and model choices for Worker and Reviewer.</text>
  <rect x="1032" y="70" width="184" height="22" rx="11" fill="#26354d"/>
  <text x="1124.0" y="85" font-size="10" fill="#eac58c" font-weight="600" text-anchor="middle">PENDING DESIGN REVIEW</text>
  <rect x="1240" y="66" width="176" height="34" rx="5" fill="#252c37" stroke="#394352"/>
  <text x="1328.0" y="87.5" font-size="12" fill="#e4e8f0" font-weight="400" text-anchor="middle">Back to tasks</text>
  </g>
  <text x="24" y="884" font-size="10" fill="#95a4ba" font-weight="400">STATIC SVG · Sample content only · No live request or credential</text>
  <text x="1416" y="884" font-size="10" fill="#95a4ba" font-weight="400" text-anchor="end">Design approval precedes API and UI implementation</text>
  <line x1="24" y1="174" x2="1416" y2="174" stroke="#394352"/>
  <text x="44" y="156" font-size="14" fill="#91bbff" font-weight="600">Draft setup</text>
  <rect x="24" y="172" width="160" height="3" rx="0" fill="#91bbff"/>
  <text x="1416" y="154" font-size="11" fill="#95a4ba" font-weight="400" text-anchor="end">New-task dialog + edit-state reference · illustrative content</text>
  <rect x="24" y="194" width="980" height="664" rx="6" fill="#20242c" stroke="#394352"/>
  <rect x="1024" y="194" width="392" height="664" rx="6" fill="#1d232d" stroke="#394352"/>
  <g id="new-task-dialog">
  <text x="48" y="228" font-size="22" fill="#e4e8f0" font-weight="600">New task</text>
  <rect x="748" y="210" width="174" height="22" rx="11" fill="#26354d"/>
  <text x="835.0" y="225" font-size="10" fill="#91bbff" font-weight="600" text-anchor="middle">DRAFT · EXAMPLE</text>
  <path d="M960 216 l12 12 M972 216 l-12 12" fill="none" stroke="#b1bdce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="270" font-size="11" fill="#b1bdce" font-weight="600">TASK NAME</text>
  <rect x="48" y="282" width="932" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <text x="60" y="303.5" font-size="13" fill="#e4e8f0" font-weight="400">Fix retry cancellation</text>
  <text x="48" y="338" font-size="11" fill="#b1bdce" font-weight="600">TASK REQUIREMENTS</text>
  <rect x="48" y="350" width="932" height="48" rx="5" fill="#171c24" stroke="#394352"/>
  <text x="60" y="370" font-size="12" fill="#e4e8f0" font-weight="400">Stop pending retries when a task is cancelled.</text>
  <text x="60" y="388" font-size="12" fill="#e4e8f0" font-weight="400">Preserve the final error.</text>
  <text x="48" y="424" font-size="11" fill="#b1bdce" font-weight="600">REVIEWER ROLE</text>
  <rect x="48" y="436" width="104" height="34" rx="5" fill="#22334d" stroke="#557eaf"/>
  <circle cx="61" cy="453" r="5" fill="#91bbff"/>
  <circle cx="61" cy="453" r="2" fill="#171c24"/>
  <text x="74" y="458" font-size="12" fill="#e4e8f0" font-weight="400">Bug</text>
  <rect x="160" y="436" width="104" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <circle cx="173" cy="453" r="5" fill="#394352"/>
  <text x="186" y="458" font-size="12" fill="#e4e8f0" font-weight="400">Feature</text>
  <rect x="272" y="436" width="104" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <circle cx="285" cy="453" r="5" fill="#394352"/>
  <text x="298" y="458" font-size="12" fill="#e4e8f0" font-weight="400">Review</text>
  <rect x="384" y="436" width="104" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <circle cx="397" cy="453" r="5" fill="#394352"/>
  <text x="410" y="458" font-size="12" fill="#e4e8f0" font-weight="400">Refactor</text>
  <text x="520" y="424" font-size="11" fill="#b1bdce" font-weight="600">MAXIMUM ROUNDS</text>
  <rect x="520" y="436" width="144" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <text x="532" y="457.5" font-size="13" fill="#e4e8f0" font-weight="400">5</text>
  <text x="688" y="449" font-size="11" fill="#95a4ba" font-weight="400">Worker keeps its general role.</text>
  <text x="688" y="467" font-size="11" fill="#95a4ba" font-weight="400">Role instructions stay with the task.</text>
  </g>
  <g id="independent-agent-bindings">
  <rect x="48" y="490" width="448" height="246" rx="6" fill="#232b36" stroke="#394352"/>
  <rect x="520" y="490" width="460" height="246" rx="6" fill="#222e32" stroke="#394352"/>
