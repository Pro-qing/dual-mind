  <text x="536" y="515" font-size="14" fill="#93dfcd" font-weight="600">Reviewer</text>
  <rect x="834" y="498" width="130" height="22" rx="11" fill="#26354d"/>
  <text x="899.0" y="513" font-size="10" fill="#93dfcd" font-weight="600" text-anchor="middle">From defaults</text>
  <text x="64" y="542" font-size="10" fill="#95a4ba" font-weight="600">CONNECTION</text>
  <rect x="64" y="552" width="416" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <text x="76" y="573.5" font-size="13" fill="#e4e8f0" font-weight="400">OpenAI</text>
  <path d="M455 567.0 l5 5 l5 -5" fill="none" stroke="#b1bdce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="536" y="542" font-size="10" fill="#95a4ba" font-weight="600">CONNECTION</text>
  <rect x="536" y="552" width="428" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <text x="548" y="573.5" font-size="13" fill="#e4e8f0" font-weight="400">Local gateway</text>
  <path d="M939 567.0 l5 5 l5 -5" fill="none" stroke="#b1bdce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="612" font-size="10" fill="#95a4ba" font-weight="600">MODEL ID</text>
  <rect x="384" y="595" width="96" height="26" rx="5" fill="#252c37" stroke="#394352"/>
  <text x="432.0" y="612.5" font-size="12" fill="#e4e8f0" font-weight="400" text-anchor="middle">Refresh</text>
  <text x="536" y="612" font-size="10" fill="#95a4ba" font-weight="600">MODEL ID</text>
  <rect x="868" y="595" width="96" height="26" rx="5" fill="#242a34" stroke="#394352"/>
  <text x="916.0" y="612.5" font-size="12" fill="#95a4ba" font-weight="400" text-anchor="middle">Fetch</text>
  <rect x="64" y="628" width="416" height="36" rx="5" fill="#171c24" stroke="#91bbff"/>
  <text x="76" y="650.5" font-size="12" fill="#e4e8f0" font-weight="400" class="mono">example-model-alpha</text>
  <path d="M455 644.0 l5 5 l5 -5" fill="none" stroke="#b1bdce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="536" y="628" width="428" height="36" rx="5" fill="#171c24" stroke="#394352"/>
  <text x="548" y="650.5" font-size="12" fill="#e4e8f0" font-weight="400" class="mono">gateway-review-v2</text>
  <path d="M939 644.0 l5 5 l5 -5" fill="none" stroke="#b1bdce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="547" cy="687" r="3" fill="#eac58c"/>
  <text x="560" y="692" font-size="11" fill="#eac58c" font-weight="400">Key missing · list not fetched</text>
  <text x="536" y="714" font-size="11" fill="#95a4ba" font-weight="400">Manual model ID retained. Set a key in Settings.</text>
  <rect x="64" y="668" width="416" height="110" rx="5" fill="#171e29" stroke="#557eaf"/>
  <rect x="68" y="672" width="400" height="29" rx="3" fill="#253e5b"/>
  <text x="80" y="692" font-size="12" fill="#e4e8f0" font-weight="400" class="mono">example-model-alpha</text>
  <path d="M444 683 l4 4 l8 -9" fill="none" stroke="#91bbff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="723" font-size="12" fill="#e4e8f0" font-weight="400" class="mono">example-model-beta</text>
  <line x1="76" y1="737" x2="468" y2="737" stroke="#394352"/>
  <text x="80" y="760" font-size="11" fill="#95a4ba" font-weight="400">Search IDs or enter your own…</text>
  <rect x="472" y="675" width="3" height="55" rx="1" fill="#303b4b"/>
  <rect x="472" y="675" width="3" height="26" rx="1" fill="#6c86a7"/>
  <text x="536" y="763" font-size="11" fill="#95a4ba" font-weight="400">Lists stay separate for each connection.</text>
  </g>
  <g id="draft-actions">
  <rect x="48" y="790" width="932" height="26" rx="4" fill="#342e23" stroke="#5c4b32"/>
  <text x="62" y="808" font-size="11" fill="#eac58c" font-weight="400">API setup is incomplete. You can still save this draft and finish configuration later.</text>
  <text x="48" y="842" font-size="11" fill="#95a4ba" font-weight="400">Saving a draft does not run a model.</text>
  <rect x="700" y="824" width="112" height="28" rx="5" fill="#252c37" stroke="#394352"/>
  <text x="756.0" y="842.5" font-size="12" fill="#e4e8f0" font-weight="400" text-anchor="middle">Cancel</text>
  <rect x="824" y="824" width="156" height="28" rx="5" fill="#305981" stroke="#527fb0"/>
  <text x="902.0" y="842.5" font-size="12" fill="#e4e8f0" font-weight="400" text-anchor="middle">Create draft</text>
  </g>
  <g id="edit-draft-reference">
  <text x="1048" y="223" font-size="11" fill="#b1bdce" font-weight="600">EDIT DRAFT · STATE EXAMPLE</text>
  <text x="1048" y="245" font-size="11" fill="#95a4ba" font-weight="400">Reference inset, outside the new-task dialog.</text>
  <rect x="1048" y="262" width="344" height="182" rx="5" fill="#242b36" stroke="#343e4d"/>
  <text x="1064" y="288" font-size="14" fill="#e4e8f0" font-weight="600">Keep the saved model ID</text>
  <text x="1064" y="316" font-size="10" fill="#95a4ba" font-weight="600">WORKER / OPENAI</text>
  <rect x="1064" y="326" width="312" height="34" rx="5" fill="#171c24" stroke="#394352"/>
  <text x="1076" y="347.5" font-size="12" fill="#e4e8f0" font-weight="400" class="mono">legacy-worker-model</text>
  <path d="M1351 341.0 l5 5 l5 -5" fill="none" stroke="#b1bdce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1064" y="383" font-size="11" fill="#95a4ba" font-weight="400">Not in the latest list? Keep it until</text>
  <text x="1064" y="401" font-size="11" fill="#95a4ba" font-weight="400">you explicitly choose a different ID.</text>
  <rect x="1064" y="410" width="154" height="26" rx="5" fill="#305981" stroke="#527fb0"/>
  <text x="1141.0" y="427.5" font-size="12" fill="#e4e8f0" font-weight="400" text-anchor="middle">Save draft</text>
  </g>
  <g id="connection-switch-reference">
  <rect x="1048" y="462" width="344" height="144" rx="5" fill="#242b36" stroke="#343e4d"/>
  <text x="1064" y="488" font-size="11" fill="#b1bdce" font-weight="600">SWITCH CONNECTION</text>
  <text x="1064" y="514" font-size="13" fill="#91bbff" font-weight="400">OpenAI → Local gateway</text>
  <text x="1064" y="539" font-size="11" fill="#95a4ba" font-weight="400">Suggestions follow the selected connection.</text>
  <text x="1064" y="560" font-size="11" fill="#95a4ba" font-weight="400">Use its default or type another model ID.</text>
  <text x="1064" y="581" font-size="11" fill="#95a4ba" font-weight="400">Only this form changes; saved drafts stay.</text>
  </g>
  <g id="narrow-window-reference">
  <text x="1048" y="637" font-size="11" fill="#b1bdce" font-weight="600">NARROW WINDOW · BELOW 900px</text>
  <rect x="1048" y="652" width="150" height="60" rx="5" fill="#232b36" stroke="#394352"/>
  <text x="1060" y="675" font-size="12" fill="#91bbff" font-weight="600">Worker</text>
  <rect x="1060" y="685" width="126" height="14" rx="3" fill="#171c24" stroke="#394352"/>
  <path d="M1118 721 l6 6 l6 -6" fill="none" stroke="#95a4ba" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1048" y="736" width="150" height="60" rx="5" fill="#222e32" stroke="#394352"/>
  <text x="1060" y="759" font-size="12" fill="#93dfcd" font-weight="600">Reviewer</text>
  <rect x="1060" y="769" width="126" height="14" rx="3" fill="#171c24" stroke="#394352"/>
  <text x="1216" y="673" font-size="11" fill="#95a4ba" font-weight="400">Worker first.</text>
  <text x="1216" y="697" font-size="11" fill="#95a4ba" font-weight="400">Reviewer below.</text>
  <text x="1216" y="721" font-size="11" fill="#95a4ba" font-weight="400">Menus scroll inside</text>
  <text x="1216" y="745" font-size="11" fill="#95a4ba" font-weight="400">the dialog.</text>
  <text x="1216" y="769" font-size="11" fill="#95a4ba" font-weight="400">Actions remain visible.</text>
  <text x="1048" y="824" font-size="11" fill="#95a4ba" font-weight="400">Refresh keeps existing selections.</text>
  <text x="1048" y="842" font-size="11" fill="#95a4ba" font-weight="400">Model IDs are illustrative, not recommendations.</text>
  </g>
</svg>
