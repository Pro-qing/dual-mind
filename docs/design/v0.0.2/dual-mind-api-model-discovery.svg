<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">DualMind — API connection and model discovery proposal</title>
  <desc id="description">Pending-review static design: save a connection without a default model, set its key in the host password prompt, explicitly test and fetch model IDs, search or enter a custom ID, and handle configuration, query and empty-list states. All results and connection metadata are illustrative.</desc>
