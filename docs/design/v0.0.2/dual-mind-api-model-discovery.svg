  <text x="1088" y="611" font-size="11" fill="#b1bdce" font-weight="400">Check the URL, key or endpoint support.</text>
  <text x="1088" y="629" font-size="11" fill="#b1bdce" font-weight="400">Retry, or enter a model ID manually.</text>
  <rect x="1072" y="660" width="324" height="80" rx="5" fill="#242b36" stroke="#343e4d"/>
  <circle cx="1087" cy="681" r="3" fill="#eac58c"/>
  <text x="1100" y="686" font-size="13" fill="#eac58c" font-weight="600">Address edited</text>
  <text x="1088" y="707" font-size="11" fill="#b1bdce" font-weight="400">Save the changed Base URL first.</text>
  <text x="1088" y="725" font-size="11" fill="#b1bdce" font-weight="400">Fetch again after address or key changes.</text>
  <text x="1072" y="774" font-size="11" fill="#b1bdce" font-weight="600">WHAT SUCCESS MEANS</text>
  <text x="1072" y="798" font-size="11" fill="#95a4ba" font-weight="400">The model list is accessible.</text>
  <text x="1072" y="818" font-size="11" fill="#95a4ba" font-weight="400">No inference or task execution is tested.</text>
  <text x="1072" y="838" font-size="11" fill="#95a4ba" font-weight="400">No task text is sent by this query.</text>
