  <text x="328" y="371.5" font-size="12" fill="#e4e8f0" font-weight="400" class="mono">https://api.openai.com/v1</text>
  <text x="316" y="404" font-size="11" fill="#95a4ba" font-weight="400">Use the API base path. Save address changes before querying.</text>
