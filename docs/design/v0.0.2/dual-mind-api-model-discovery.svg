  <line x1="224" y1="39" x2="1440" y2="39" stroke="#394352"/>
  <text x="1416" y="25" font-size="11" fill="#b1bdce" font-weight="400" text-anchor="end">MODEL DISCOVERY / 06</text>
  </g>
