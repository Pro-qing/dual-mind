  <text x="332" y="745" font-size="12" fill="#e4e8f0" font-weight="400" class="mono">example-model-delta</text>
  <text x="316" y="782" font-size="11" fill="#95a4ba" font-weight="400">Type any custom ID; fetching never replaces your selected model.</text>
