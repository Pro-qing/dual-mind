<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">DualMind — parallel task workbench, additions pending review</title>
  <desc id="description">Illustrative workspace task list with concurrent tasks. The selected Bug task has a fixed Worker and a role-specific Reviewer, independent model labels, per-task controls, feedback and explicit result application.</desc>
