    <text x="298" y="572" font-size="10" fill="#bcd2f1" font-weight="400" class="mono">  signal?.throwIfAborted();</text>
    <text x="298" y="591" font-size="10" fill="#bcd2f1" font-weight="400" class="mono">  // Run the operation and preserve the final error.</text>
    <text x="298" y="610" font-size="10" fill="#bcd2f1" font-weight="400" class="mono">}</text>
