<text x="52" y="718" font-size="13" fill="#91bbff" font-weight="400">› 命令记录 · 查看实际命令、输出和退出状态</text>
<text x="752" y="619" font-size="14" fill="#e4e8f0" font-weight="400">第 1 轮：未通过，已下发方案 v2。</text>
<text x="752" y="651" font-size="13" fill="#b1bdce" font-weight="400">第 2 轮：等待 Worker 提交成果。</text>
<text x="752" y="718" font-size="13" fill="#b1bdce" font-weight="400">验收通过后完成；达到轮次上限时保留剩余问题。</text>
