<text x="52" y="306" font-size="14" fill="#e4e8f0" font-weight="400">本轮目标：补齐取消路径，保留已完成的导出能力。</text>
<text x="52" y="336" font-size="14" fill="#ffce8b" font-weight="400">修订原因：上一轮导出结果正确，但取消后仍生成空文件。</text>
<text x="52" y="370" font-size="14" fill="#e4e8f0" font-weight="600">工作步骤</text>
<text x="52" y="399" font-size="14" fill="#e4e8f0" font-weight="400">1. 调整取消路径，确保写文件前判断用户选择。</text>
<text x="52" y="427" font-size="14" fill="#e4e8f0" font-weight="400">2. 增加回归验证并提交结果。</text>
<text x="760" y="370" font-size="14" fill="#e4e8f0" font-weight="600">验收条件</text>
<text x="760" y="399" font-size="14" fill="#e4e8f0" font-weight="400">A1  输出包含必需字段 · 命令验证</text>
<text x="760" y="427" font-size="14" fill="#e4e8f0" font-weight="400">A2  取消不产生文件 · 命令验证</text>
<text x="760" y="455" font-size="14" fill="#e4e8f0" font-weight="400">A3  使用说明与实际行为一致 · 阅读审查</text>
<text x="52" y="502" font-size="13" fill="#b1bdce" font-weight="400">方案由 Reviewer 下发，Worker 按方案实施；验收未通过后自动进入下一轮。</text>
