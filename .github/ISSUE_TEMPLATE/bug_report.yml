name: Bug report / 问题报告
description: Report a reproducible scaffold problem / 报告可复现的骨架问题
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'For sensitive reports, read SECURITY.md first. 敏感报告请先阅读 SECURITY.zh.md。'
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, VS Code, Node.js, npm, and commit / 系统、编辑器、Node、npm 与提交
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / 相关日志
      description: Remove secrets and personal data / 请移除凭据和个人信息
      render: text
