name: Feature request / 功能建议
description: Propose a focused improvement / 提出范围明确的改进
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题或使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 预期功能
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and alternatives / 验收标准及备选方案
  - type: markdown
    attributes:
      value: 'Existing SVG designs are approved. New UI changes should include a design revision for review. 现有 SVG 设计已获认可，新增界面变更应附设计修订供审核。'
